<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M256 32 C340 32 448 64 448 64 V232 C448 356 348 448 256 480 C164 448 64 356 64 232 V64 C64 64 172 32 256 32 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#accentGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"/>
        
  <!-- Inner Glowing Radar Lines -->
  <path d="M256 120 V380 M126 250 H386" 
        stroke="url(#accentGrad)" 
        stroke-width="6" 
        stroke-dasharray="12,12" 
        opacity="0.4" />
        
  <circle cx="256" cy="250" r="90" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="8" 
          opacity="0.6" />
          
  <!-- AI Core Lock / Radar Eye -->
  <path d="M256 170 L320 220 V290 L256 330 L192 290 V220 Z" 
        fill="#0f172a" 
        stroke="url(#accentGrad)" 
        stroke-width="10" 
        filter="url(#glow)" />
        
  <circle cx="256" cy="255" r="24" fill="url(#accentGrad)" />
</svg>
