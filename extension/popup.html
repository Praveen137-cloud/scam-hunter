<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scam Hunter AI Radar</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-dark: #121824;
      --border-dark: #1e293b;
      --cyber-500: #06b6d4;
      --text-100: #f8fafc;
      --text-400: #94a3b8;
      --red-500: #ef4444;
      --green-500: #22c55e;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-dark);
      color: var(--text-100);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
      font-size: 13px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-b: 1px solid var(--border-dark);
      margin-bottom: 16px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header h1 span {
      color: var(--cyber-500);
    }

    /* Target site box */
    .site-box {
      background-color: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .site-box h2 {
      margin: 0 0 6px 0;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-400);
    }
    .site-url {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-100);
      word-break: break-all;
      margin-bottom: 8px;
      font-weight: bold;
    }
    
    /* Risk indicator */
    .risk-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background-color: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .risk-badge.Safe {
      background-color: rgba(34, 197, 94, 0.1);
      color: var(--green-500);
      border-color: rgba(34, 197, 94, 0.2);
    }
    .risk-badge.Medium {
      background-color: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.2);
    }
    .risk-badge.High {
      background-color: rgba(249, 115, 22, 0.1);
      color: #f97316;
      border-color: rgba(249, 115, 22, 0.2);
    }
    .risk-badge.Critical {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--red-500);
      border-color: rgba(239, 68, 68, 0.2);
    }

    /* Lookup form */
    .search-box h2 {
      margin: 0 0 8px 0;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-100);
    }
    .search-form {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .search-input {
      flex: 1;
      background-color: #1a2236;
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      color: var(--text-100);
      padding: 6px 10px;
      font-size: 12px;
      font-family: monospace;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--cyber-500);
    }
    .search-btn {
      background-color: var(--cyber-500);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .search-btn:hover {
      background-color: #0891b2;
    }

    /* Result details panel */
    .details-panel {
      background-color: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      display: none;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 6px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .detail-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .detail-label {
      color: var(--text-400);
    }
    .detail-val {
      font-weight: bold;
      color: var(--text-100);
    }

    /* Footer info */
    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-400);
      margin-top: 16px;
      padding-top: 10px;
      border-t: 1px solid rgba(255,255,255,0.05);
    }
    .loader {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      border-top-color: var(--cyber-500);
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="cyber-500" style="color: var(--cyber-500)">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <h1>ScamHunter<span>AI</span> Radar</h1>
  </div>

  <!-- Target site indicator -->
  <div class="site-box">
    <h2>Current Tab Analysis</h2>
    <div id="siteUrl" class="site-url">detecting active page...</div>
    <div id="siteRisk" class="risk-badge">
      <div class="loader"></div> &nbsp;Scanning
    </div>
  </div>

  <!-- Manual search indicator lookup -->
  <div class="search-box">
    <h2>Manual Indicator Lookup</h2>
    <form id="searchForm" class="search-form" onsubmit="return false;">
      <input type="text" id="searchInput" class="search-input" placeholder="UPI ID, phone, account, domain..." required>
      <button type="submit" id="searchBtn" class="search-btn">Verify</button>
    </form>
  </div>

  <!-- Search results detail -->
  <div id="detailsPanel" class="details-panel">
    <div class="detail-row">
      <span class="detail-label">Status:</span>
      <span id="detailStatus" class="detail-val">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Risk Rating:</span>
      <span id="detailRisk" class="detail-val">-</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Scam Category:</span>
      <span id="detailCategory" class="detail-val">-</span>
    </div>
    <div class="detail-row" id="reportsRow">
      <span class="detail-label">Report History:</span>
      <span id="detailReports" class="detail-val">-</span>
    </div>
  </div>

  <div class="footer">
    Helpline: 1930 | cybercrime.gov.in
  </div>

  <script src="popup.js"></script>
</body>
</html>
